name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact -v
      - name: 자격증명/payload 로깅 패턴 금지
        run: |
          if grep -rnE 'console\.(log|warn|error)\(\s*(payload|data)\b|JSON\.stringify\(\s*payload|console\.(log|warn|error)\([^)]*(deviceSecret|serverAuthCode|\.token\b)' src/; then
            echo "::error::자격증명/payload 로깅 의심 패턴 발견"
            exit 1
          fi

  smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/zoocat_ci
      DB_NAME: zoocat_ci
      PORT: "3000"
      AUTH_PEPPER: ci-pepper-not-a-secret
      SESSION_IP_SALT: ci-ip-salt-not-a-secret
      RATE_REGISTER_PER_HOUR: "1000"
      RATE_LOGIN_PER_MIN: "1000"
      RATE_RESUME_PER_MIN: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: node dist/index.js &
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "server did not become healthy"; exit 1
      - name: Socket smoke test
        run: npm run test:socket
