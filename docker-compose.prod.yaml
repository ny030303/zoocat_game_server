# 배포 전용 — mongo 서비스 없음. MONGO_URI 는 .env 에서 Atlas 를 가리킨다.
#
#   실행:   export IMAGE_TAG=<commit-sha>        # 또는 latest
#           docker compose -f docker-compose.prod.yaml pull
#           docker compose -f docker-compose.prod.yaml up -d
#
# 이미지는 CI(GitHub Actions)가 빌드해 GHCR 에 올린 것을 pull 한다.
# CI 세팅 전이라면 로컬에서 `docker build -f Dockerfile.prod -t <이미지> . && docker push <이미지>`
# 하거나, 임시로 아래 build: 줄의 주석을 풀어 박스에서 직접 빌드한다(1GB 박스에서는 비권장).
services:
  backend:
    image: ghcr.io/ny030303/zoocat_game_server:${IMAGE_TAG:-latest}
    # build: { context: ./, dockerfile: Dockerfile.prod }
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"          # 리버스 프록시(예: Caddy)만 접근
    env_file:
      - .env                            # MONGO_URI, DB_NAME, PORT ... 이미지에 넣지 않음
    mem_limit: 700m
    memswap_limit: 1400m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
