# 배포 전용 — backend(GHCR 이미지) + caddy(리버스 프록시 · 자동 HTTPS).
# MongoDB 는 Atlas (.env 의 MONGO_URI). 도메인은 .env 의 DOMAIN.
#
#   export IMAGE_TAG=<commit-sha>        # 또는 latest
#   docker compose -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.prod.yaml up -d
services:
  backend:
    image: ghcr.io/ny030303/zoocat_game_server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"          # 박스 로컬 디버깅용 (외부 노출 X). caddy 는 backend:3000 으로 접근
    env_file:
      - .env
    mem_limit: 700m
    memswap_limit: 1400m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                   # HTTP/3 (QUIC)
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # 발급 인증서·ACME 계정 — 반드시 영속 (없으면 재시작마다 재발급 → LE 레이트리밋)
      - caddy_config:/config
    mem_limit: 100m

volumes:
  caddy_data:
  caddy_config:
